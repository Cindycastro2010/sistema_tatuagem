
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Agendamentos — Estúdio de Tatuagem</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="container py-4">

    <!-- Menu de navegação -->
    <nav class="navbar navbar-dark bg-dark mb-4 rounded">
        <div class="container-fluid">
            <a href="dashboard.html" class="navbar-brand">
                Estúdio de Tatuagem
            </a>

            <div class="d-flex flex-wrap align-items-center gap-3">
                <a href="clientes.html" class="text-light text-decoration-none">
                    Clientes
                </a>

                <a href="senioridade.html" class="text-light text-decoration-none">
                    Senioridade
                </a>

                <a href="estilos.html" class="text-light text-decoration-none">
                    Estilos
                </a>

                <a href="tatuadores.html" class="text-light text-decoration-none">
                    Tatuadores
                </a>

                <a href="agendamentos.html" class="text-light text-decoration-none">
                    Agendamentos
                </a>

                <button onclick="sair()" class="btn btn-outline-light btn-sm">
                    Sair
                </button>
            </div>
        </div>
    </nav>

    <h1>Agendamentos</h1>

    <p class="text-muted">
        Cadastre, consulte e gerencie os agendamentos do estúdio.
    </p>

    <!-- Formulário de agendamento -->
    <form id="form-agendamento" class="row g-3 mt-2 mb-4">

        <div class="col-md-3">
            <label for="idcliente" class="form-label">Cliente</label>
            <select id="idcliente" class="form-select" required>
                <option value="">Selecione um cliente...</option>
            </select>
        </div>

        <div class="col-md-3">
            <label for="idtatuador" class="form-label">Tatuador</label>
            <select id="idtatuador" class="form-select" required>
                <option value="">Selecione um tatuador...</option>
            </select>
        </div>

        <div class="col-md-2">
            <label for="dataagendamento" class="form-label">Data</label>
            <input
                type="date"
                id="dataagendamento"
                class="form-control"
                required
            >
        </div>

        <div class="col-md-2">
            <label for="horaagendamento" class="form-label">Horário</label>
            <input
                type="time"
                id="horaagendamento"
                class="form-control"
                required
            >
        </div>

        <div class="col-md-2">
            <label for="valortatuagem" class="form-label">Valor (R$)</label>
            <input
                type="number"
                id="valortatuagem"
                class="form-control"
                placeholder="0,00"
                step="0.01"
                min="0"
            >
        </div>

        <div class="col-md-12">
            <label for="descricaotatuagem" class="form-label">
                Descrição da tatuagem
            </label>

            <textarea
                id="descricaotatuagem"
                class="form-control"
                rows="3"
                placeholder="Descreva a tatuagem desejada..."
            ></textarea>
        </div>

        <!-- Imagem do desenho -->
        <div class="col-md-4">
            <label for="desenho" class="form-label">
                Desenho aprovado (imagem)
            </label>

            <input
                type="file"
                id="desenho"
                class="form-control"
                accept="image/*"
            >
        </div>

        <!-- Status visível durante a edição -->
        <div class="col-md-3" id="bloco-status" style="display: none;">
            <label for="status" class="form-label">Status</label>

            <select id="status" class="form-select">
                <option value="pendente">Pendente</option>
                <option value="confirmado">Confirmado</option>
                <option value="concluido">Concluído</option>
                <option value="cancelado">Cancelado</option>
            </select>
        </div>

        <div class="col-md-3 d-flex align-items-end">
            <button
                id="btn-submit-agendamento"
                type="submit"
                class="btn btn-primary w-100"
            >
                Cadastrar agendamento
            </button>
        </div>

    </form>

    <!-- Tabela de agendamentos -->
    <div class="table-responsive">
        <table class="table table-bordered table-striped align-middle">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Cliente</th>
                    <th>Tatuador</th>
                    <th>Data</th>
                    <th>Hora</th>
                    <th>Valor</th>
                    <th>Status</th>
                    <th>Desenho</th>
                    <th>Ações</th>
                </tr>
            </thead>

            <tbody id="corpo-tabela">
                <!-- Preenchido pelo JavaScript -->
            </tbody>
        </table>
    </div>

    <!-- Scripts -->
    <script src="js/auth.js"></script>

    <script>
        protegerPagina();
    </script>

    <script src="js/agendamentos.js"></script>

</body>
</html>
