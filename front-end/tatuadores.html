
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tatuadores — Estúdio de Tatuagem</title>

  <link
   <link rel="stylesheet" href="css/style.css">
    rel="stylesheet"
  >
</head>

<body class="container py-4">

 <nav class="navbar navbar-dark bg-dark mb-4">
  <div class="container">
    <span class="navbar-brand">Estúdio de Tatuagem</span>
    <div>
      <a href="clientes.html" class="text-light me-3">Clientes</a>
      <a href="senioridade.html" class="text-light me-3">Senioridade</a>
      <a href="estilos.html" class="text-light me-3">Estilos</a>
      <a href="tatuadores.html" class="text-light me-3">Tatuadores</a>
      <a href="agendamentos.html" class="text-light me-3">Agendamentos</a>
      <button onclick="sair()" class="btn btn-outline-light btn-sm">Sair</button>
    </div>
  </div>
</nav>
  <h1>Tatuadores</h1>

  <!-- Formulário para cadastrar ou editar tatuadores -->
  <form id="form-tatuador" class="row g-3 mt-2 mb-4">

    <div class="col-md-3">
      <label for="nometatuador" class="form-label">Nome</label>
      <input
        type="text"
        id="nometatuador"
        class="form-control"
        placeholder="Nome"
        required
      >
    </div>

    <div class="col-md-2">
      <label for="cpf" class="form-label">CPF</label>
      <input
        type="text"
        id="cpf"
        class="form-control"
        placeholder="CPF (só números)"
        required
      >
    </div>

    <div class="col-md-3">
      <label for="email" class="form-label">E-mail</label>
      <input
        type="email"
        id="email"
        class="form-control"
        placeholder="E-mail"
      >
    </div>

    <div class="col-md-2">
      <label for="telefone" class="form-label">Telefone</label>
      <input
        type="text"
        id="telefone"
        class="form-control"
        placeholder="Telefone"
      >
    </div>

    <div class="col-md-2">
      <label for="idsenioridade" class="form-label">Senioridade</label>
      <select id="idsenioridade" class="form-select" required>
        <option value="">Senioridade...</option>
        <!-- Preenchido pelo JavaScript -->
      </select>
    </div>

    <!-- Estilos que o tatuador domina -->
    <div class="col-md-12">
      <label class="form-label">Estilos que domina</label>

      <div
        id="lista-estilos"
        class="d-flex flex-wrap gap-3"
      >
        <!-- Os checkboxes serão preenchidos pelo JavaScript -->
      </div>
    </div>

    <!-- Botões do formulário -->
    <div class="col-md-3">
      <button
        id="btn-submit-tatuador"
        type="submit"
        class="btn btn-primary w-100"
      >
        Cadastrar
      </button>
    </div>

    <div class="col-md-3">
      <button
        type="button"
        class="btn btn-secondary w-100"
        onclick="limparFormulario()"
      >
        Limpar formulário
      </button>
    </div>

  </form>

  <!-- Tabela de tatuadores -->
  <h2 class="h4">Tatuadores cadastrados</h2>

  <div class="table-responsive">
    <table class="table table-bordered table-striped">
      <thead class="table-dark">
        <tr>
          <th>ID</th>
          <th>Nome</th>
          <th>CPF</th>
          <th>E-mail</th>
          <th>Telefone</th>
          <th>Senioridade</th>
          <th>Ações</th>
        </tr>
      </thead>

      <tbody id="corpo-tabela">
        <!-- Os tatuadores serão carregados pelo JavaScript -->
      </tbody>
    </table>
  </div>

  <!-- JavaScript da página -->
   <script src="js/auth.js"></script>
  <script src="js/tatuadores.js"></script>

</body>
</html>
